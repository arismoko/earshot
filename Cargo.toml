[package]
name = "mod-earshot"
version = "2.0.9"
edition = "2024"
license = "MIT AND BSD-3-Clause"
publish = false
description = "Earshot for Sunrise: proximity voice chat compatible with Simple Voice Chat. Not affiliated with Simple Voice Chat."

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command (the
# launcher builds against its own copy of the same build).
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
# Earshot's game-independent core: wire format, encryption, Opus, audio, the voice server.
# Its registry dependencies are pinned in Cargo.lock .
earshot-core = { path = "src/core" }
serde_json = "1"
